<title>Расписание занятий</title>

<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EDF1F0; --surface:#FFFFFF; --ink:#13242B; --muted:#5B6B72; --line:#D3DCDA;
  --accent:#1B5FC1; --accent-ink:#FFFFFF; --today:#D93A74;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A1E; --surface:#16252B; --ink:#E6EEF0; --muted:#8FA2A9; --line:#27393F;
    --accent:#6EA2F0; --accent-ink:#0F1A1E; --today:#FF7AA2;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A1E; --surface:#16252B; --ink:#E6EEF0; --muted:#8FA2A9; --line:#27393F;
  --accent:#6EA2F0; --accent-ink:#0F1A1E; --today:#FF7AA2;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:16px; line-height:1.4;
}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 48px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{margin:0;font-size:clamp(26px,4.4vw,40px);line-height:1.05;font-weight:700;letter-spacing:-.02em}
.sub{margin:6px 0 0;color:var(--muted);font-size:15px}
.btn{
  background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:9px 14px;
  font-weight:600;cursor:pointer;
}
.btn:hover{opacity:.88}

.weeks{
  display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin-bottom:6px;
  scrollbar-width:thin;
}
.wk{
  flex:0 0 auto;min-width:74px;text-align:left;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;
}
.wk b{display:block;font-size:17px;line-height:1.1}
.wk span{display:block;font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap}
.wk[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wk[aria-current="true"] span{color:inherit;opacity:.85}
.wk.now:not([aria-current="true"]){border-color:var(--today);box-shadow:inset 0 -3px 0 var(--today)}

.filters{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;margin:8px 0 18px}
.filters label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.filters select{
  background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;color:var(--ink);
}

.tabs{display:none;gap:6px;margin-bottom:12px}
.tab{
  flex:1;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:6px;
  padding:7px 0;text-align:center;line-height:1.15;
}
.tab b{display:block;font-size:15px}
.tab span{font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] span{color:inherit;opacity:.85}
.tab.today:not([aria-selected="true"]){border-color:var(--today)}

.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}
.day{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.day.today{border-color:var(--today);box-shadow:0 0 0 1px var(--today)}
.dh{display:flex;align-items:baseline;justify-content:space-between;padding:11px 12px 9px;border-bottom:1px solid var(--line)}
.dh b{font-size:17px}
.dh span{color:var(--muted);font-size:14px}
.day.today .dh span{color:var(--today);font-weight:600}
.empty{padding:18px 12px;color:var(--muted);font-size:14px}

.lesson{
  display:grid;grid-template-columns:48px 1fr;gap:10px;padding:10px 12px 10px 10px;
  border-bottom:1px solid var(--line);position:relative;
  border-left:4px solid var(--c);
}
.lesson:last-child{border-bottom:0}
.lesson.now{background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.t{font-variant-numeric:tabular-nums;font-size:13px;line-height:1.25;color:var(--muted)}
.t b{display:block;color:var(--ink);font-weight:600}
.s{font-weight:600;line-height:1.25}
.m{margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px;font-size:13px;color:var(--muted)}
.chip{
  border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:12px;color:var(--ink);
  background:color-mix(in srgb,var(--c) 14%,transparent);
}
.live{color:var(--accent);font-weight:600}

footer{margin-top:28px;color:var(--muted);font-size:13px}

@media (max-width:899px){
  .tabs{display:flex}
  .grid{grid-template-columns:1fr}
  .day:not(.active){display:none}
  .dh{display:none}
  .lesson{grid-template-columns:52px 1fr}
}
@media (prefers-reduced-motion:no-preference){
  .lesson,.day{transition:background .15s}
}
</style>

/* ---------- Разбор ---------- */
const YEAR = 2026;
const expand = s => s.replace(/^@(\w+)$/gm, (_, k) => expand(M[k]));
const fixT = t => t.split('-').map(x => { const [h, m] = x.split('.'); return h.padStart(2, '0') + ':' + m; });

const weeks = [];
expand(RAW).split('\n').forEach(line => {
  line = line.trim();
  if (!line) return;
  if (line[0] === '=') { weeks.push({ n: +line.slice(1), days: [] }); return; }
  if (line[0] === '#') {
    const [d, m] = line.slice(1).split('.').map(Number);
    weeks[weeks.length - 1].days.push({ date: new Date(YEAR, m - 1, d), lessons: [] });
    return;
  }
  const [time, subj, room, tag] = line.split('|');
  const [from, to] = fixT(time);
  const day = weeks[weeks.length - 1].days.slice(-1)[0];
  day.lessons.push({ from, to, subj, room: room || '', tag: tag || '' });
});

const range = w => {
  const a = w.days[0].date, b = w.days[w.days.length - 1].date;
  return a.getMonth() === b.getMonth()
    ? `${a.getDate()}–${b.getDate()} ${MONS[a.getMonth()]}`
    : `${a.getDate()} ${MONS[a.getMonth()]} – ${b.getDate()} ${MONS[b.getMonth()]}`;
};
const rangeLong = w => {
  const a = w.days[0].date, b = w.days[w.days.length - 1].date;
  return a.getMonth() === b.getMonth()
    ? `${a.getDate()}–${b.getDate()} ${MON[a.getMonth()]}`
    : `${a.getDate()} ${MON[a.getMonth()]} – ${b.getDate()} ${MON[b.getMonth()]}`;
};

/* ---------- Состояние ---------- */
const today = new Date();
const state = { w: 0, d: 0, sub: 'all', prac: 'all' };

try {
  const saved = JSON.parse(localStorage.getItem('rasp-filters') || '{}');
  if (saved.sub) state.sub = saved.sub;
} catch (e) {}

function weekIndexFor(date) {
  let d = new Date(date);
  if (d.getDay() === 6) d.setDate(d.getDate() + 2);
  if (d.getDay() === 0) d.setDate(d.getDate() + 1);
  for (let i = 0; i < weeks.length; i++) {
    if (weeks[i].days.some(x => same(x.date, d))) return i;
  }
  if (d < weeks[0].days[0].date) return 0;
  return weeks.length - 1;
}
function dayIndexFor(wi, date) {
  const i = weeks[wi].days.findIndex(x => same(x.date, date));
  if (i >= 0) return i;
  if (date.getDay() === 6 || date.getDay() === 0 || date < weeks[wi].days[0].date) return 0;
  return 0;
}
function goToday() {
  state.w = weekIndexFor(today);
  state.d = dayIndexFor(state.w, today);
  render();
  const el = document.querySelector('.wk[aria-current="true"]');
  if (el) el.scrollIntoView({ inline: 'center', block: 'nearest' });
}

function visible(l) {
  if (l.tag === '1' || l.tag === '2') return state.sub === 'all' || state.sub === l.tag;
  if (PRAC[l.tag]) return state.prac === 'all' || PRAC[l.tag].includes(+state.prac);
  return true;
}
const mins = t => +t.slice(0, 2) * 60 + +t.slice(3);

/* ---------- Отрисовка ---------- */
const $ = id => document.getElementById(id);
function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function render() {
  const w = weeks[state.w];
  $('sub').textContent = `Неделя ${w.n} · ${rangeLong(w)}`;

  // недели
  const curW = weekIndexFor(today);
  $('weeks').innerHTML = weeks.map((x, i) =>
    `<button type="button" class="wk${i === curW ? ' now' : ''}" data-i="${i}" ${i === state.w ? 'aria-current="true"' : ''}><b>${x.n}</b><span>${range(x)}</span></button>`
  ).join('');

  // вкладки дней (мобильные)
  $('tabs').innerHTML = w.days.map((d, i) =>
    `<button type="button" role="tab" class="tab${same(d.date, today) ? ' today' : ''}" data-i="${i}" aria-selected="${i === state.d}"><b>${WDS[d.date.getDay()]}</b><span>${d.date.getDate()}</span></button>`
  ).join('');

  // дни
  const nowMin = today.getHours() * 60 + today.getMinutes();
  $('grid').innerHTML = w.days.map((d, i) => {
    const isToday = same(d.date, today);
    const ls = d.lessons.filter(visible);
    const body = ls.length ? ls.map(l => {
      const live = isToday && nowMin >= mins(l.from) && nowMin < mins(l.to);
      return `<div class="lesson${live ? ' now' : ''}" style="--c:hsl(${hue(l.subj)} 55% 48%)">
        <div class="t"><b>${l.from}</b>${l.to}</div>
        <div>
          <div class="s">${esc(l.subj)}</div>
          <div class="m">${l.room ? `<span>ауд. ${esc(l.room)}</span>` : ''}${l.tag ? `<span class="chip">${TAGS[l.tag]}</span>` : ''}${live ? '<span class="live">идёт сейчас</span>' : ''}</div>
        </div>
      </div>`;
    }).join('') : `<div class="empty">Занятий нет</div>`;
    return `<section class="day${isToday ? ' today' : ''}${i === state.d ? ' active' : ''}">
      <div class="dh"><b>${WD[d.date.getDay()]}</b><span>${d.date.getDate()} ${MON[d.date.getMonth()]}</span></div>
      ${body}</section>`;
  }).join('');

  $('fSub').value = state.sub;
}

/* ---------- События ---------- */
$('weeks').addEventListener('click', e => {
  const b = e.target.closest('.wk'); if (!b) return;
  state.w = +b.dataset.i;
  state.d = Math.min(state.d, weeks[state.w].days.length - 1);
  render();
  const el = document.querySelector('.wk[aria-current="true"]');
  if (el) el.scrollIntoView({ inline: 'center', block: 'nearest' });
});
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  state.d = +b.dataset.i; render();
});
function saveFilters() { try { localStorage.setItem('rasp-filters', JSON.stringify({ sub: state.sub, prac: state.prac })); } catch (e) {} }
$('fSub').addEventListener('change', e => { state.sub = e.target.value; saveFilters(); render(); });
$('todayBtn').addEventListener('click', goToday);

goToday();
setInterval(() => { today.setTime(Date.now()); render(); }, 60000);
</script>
</body>
</html>
